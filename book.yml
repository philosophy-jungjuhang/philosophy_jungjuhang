        min: 5
        done: false
      - slug: dasan
        title: '정약용: 착함은 행동으로 이루어진다'
        min: 5
        done: false
- id: 5
  title: 'V 19세기: 이성의 한계와 삶의 무게'
  blurb: 칸트가 이성의 한계를 그었고, 그 뒤 사람들은 역사·행복·실존을 물었어요.
  chapters:
  - num: 17
    title: 칸트와 그 뒤
    blurb: 우리가 세상을 보는 안경 자체를 살펴봤어요.
    sections:
    - num: '17.1'
      title: 칸트
      pages:
      - slug: kant-lens
        title: '칸트: 우리는 세상을 마음의 안경으로 본다'
        min: 5
        done: false
      - slug: categorical-imperative
        title: '칸트: 누구나 따라도 되는 규칙인가'
        min: 5
        done: false
      - slug: kant-enlightenment
        title: '칸트: 계몽은 스스로 생각할 용기'
        min: 5
        done: false
    - num: '17.2'
      title: 칸트 다음
      pages:
      - slug: hegel
        title: '헤겔: 생각은 부딪히며 자란다'
        min: 5
        done: false
      - slug: schopenhauer
        title: '쇼펜하우어: 끝없이 바라는 마음'
        min: 5
        done: false
  - num: 18
    title: 가장 많은 사람의 행복
    blurb: 결과로 옳고 그름을 따지고, 사회의 구조를 물었어요.
    sections:
    - num: '18.1'
      title: 공리주의와 그 비판
      pages:
      - slug: bentham
        title: '벤담: 최대 다수의 최대 행복'
