        done: false
      - slug: mill-harm
        title: '밀: 남을 해치지 않는 한 자유롭게'
        min: 5
        done: false
      - slug: mill-quality
        title: '밀: 기쁨에도 질이 있다'
        min: 5
        done: false
      - slug: marx
        title: '마르크스: 일하면서 낯설어지는 사람'
        min: 5
