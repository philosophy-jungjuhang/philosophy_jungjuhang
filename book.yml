        done: false
      - slug: hume-self
        title: '흄: ''나''는 느낌들의 묶음일까'
        min: 5
        done: false
  - num: 15
    title: 나라는 왜 있을까
    blurb: 사람들이 약속해서 나라를 만들었다고 상상해 봤어요.
    sections:
    - num: '15.1'
      title: 사회계약과 계몽
      pages:
      - slug: hobbes
        title: '홉스: 나라가 없으면 모두가 모두와 싸운다'
        min: 5
        done: false
      - slug: locke-rights
        title: '로크: 누구도 빼앗을 수 없는 권리'
        min: 5
        done: false
      - slug: rousseau
        title: '루소: 모두의 뜻, 일반의지'
        min: 5
        done: false
      - slug: wollstonecraft
        title: '울스턴크래프트: 여성에게도 같은 교육을'
