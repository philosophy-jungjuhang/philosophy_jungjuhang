# 책 전체 목차와 진행 상태의 단일 원본. 페이지를 쓰면 done: true로 바꾸고 `python3 tools/build_book.py`를 실행한다.
# 기준(뼈대): Adamson, History of Philosophy without any gaps / 대조: 윤리와 사상 교육과정(2015 고시), 워버턴 『철학의 역사』, OpenStax Introduction to Philosophy
parts:
- id: 1
  title: 'I 철학의 시작: 고대 그리스'
  blurb: 세상은 무엇으로 되어 있을까? 어떻게 살아야 할까? 그리스 사람들이 처음 던진 질문을 따라가요.
  chapters:
  - num: 1
    title: 철학은 무엇을 묻는가
    blurb: 철학이 어떤 일인지, 첫 철학자들이 세상을 어떻게 설명하려 했는지 알아봐요.
    sections:
    - num: '1.1'
      title: 철학이라는 질문 놀이
      pages:
      - slug: what-is-philosophy
        title: 철학은 '왜?'를 끝까지 묻는 일
        min: 5
        done: false
      - slug: wonder
        title: 철학은 놀라움에서 시작된다
        min: 5
        done: false
    - num: '1.2'
      title: 최초의 철학자들
      pages:
      - slug: thales
        title: '탈레스: 세상은 무엇으로 되어 있을까'
        min: 5
        done: false
      - slug: heraclitus
        title: '헤라클레이토스: 모든 것은 흐른다'
        min: 5
        done: false
      - slug: parmenides
        title: '파르메니데스: 변화는 착각일까'
        min: 5
        done: false
      - slug: pythagoras
        title: '피타고라스: 세상 속에 숨은 수'
        min: 5
        done: false
      - slug: democritus
        title: '데모크리토스: 더 쪼갤 수 없는 알갱이, 원자'
        min: 5
        done: false
  - num: 2
    title: 소크라테스
    blurb: 책을 한 권도 쓰지 않았는데 철학의 상징이 된 사람이에요.
    sections:
    - num: '2.1'
      title: 묻는 사람
      pages:
      - slug: sophists
        title: '소피스트: 사람이 만물의 척도일까'
        min: 5
        done: false
      - slug: know-nothing
        title: 소크라테스는 '모른다는 것'을 알았다
        min: 5
        done: false
      - slug: socratic-method
        title: '질문으로 생각을 끌어내기: 문답법'
        min: 5
        done: false
      - slug: examined-life
        title: 돌아보지 않는 삶은 살 만할까
        min: 5
        done: false
      - slug: socrates-death
        title: 소크라테스는 왜 감옥에서 도망치지 않았을까
        min: 5
        done: false
  - num: 3
    title: 플라톤
    blurb: 보이는 세상 너머에 진짜가 있다고 본 사람이에요.
    sections:
    - num: '3.1'
      title: 두 개의 세계
      pages:
      - slug: forms
        title: '플라톤은 보이는 것 너머에 진짜가 있다고 봤다: 이데아'
        min: 5
        done: true
      - slug: cave
        title: '동굴의 비유: 그림자만 보고 산다면'
        min: 5
        done: false
    - num: '3.2'
      title: 마음과 나라
      pages:
      - slug: soul-three
        title: 마음은 세 부분으로 되어 있다
        min: 5
        done: false
      - slug: ring-of-gyges
        title: '아무도 안 보면 착하게 살까: 기게스의 반지'
        min: 5
        done: false
      - slug: philosopher-king
        title: 철학자가 다스리는 나라
        min: 5
        done: false
  - num: 4
    title: 아리스토텔레스
    blurb: 스승 플라톤과 달리, 진짜는 사물 안에 있다고 본 사람이에요.
    sections:
    - num: '4.1'
      title: 세상을 정리하는 법
      pages:
      - slug: aristotle-vs-plato
        title: 진짜는 사물 안에 있다
        min: 5
        done: false
      - slug: four-causes
        title: 무엇이든 네 가지 '왜'로 설명한다
        min: 5
        done: false
      - slug: syllogism
        title: '생각에도 규칙이 있다: 삼단논법'
        min: 5
        done: false
    - num: '4.2'
      title: 잘 사는 법
      pages:
      - slug: eudaimonia
        title: 행복은 기분이 아니라 잘 사는 활동
        min: 5
        done: false
      - slug: golden-mean
        title: '중용: 용기는 무모함과 비겁함 사이'
        min: 5
        done: false
      - slug: political-animal
        title: 사람은 함께 살아야 사람이 된다
        min: 5
        done: false
- id: 2
  title: 'II 같은 시대, 동쪽에서: 고대 중국과 인도'
  blurb: 그리스 철학자들이 활동하던 무렵, 중국과 인도에서도 같은 질문을 다르게 물었어요.
  chapters:
  - num: 5
    title: 공자와 유가
    blurb: 좋은 사람, 좋은 사회는 관계 속에서 만들어진다고 본 사람들이에요.
    sections:
    - num: '5.1'
      title: 공자
      pages:
      - slug: confucius-ren
        title: '공자: 사람다움, 인(仁)'
        min: 5
        done: false
      - slug: confucius-li
        title: '예(禮): 마음을 담은 몸가짐'
        min: 5
        done: false
    - num: '5.2'
      title: 사람의 본성
      pages:
      - slug: mencius
        title: '맹자: 사람은 착하게 태어난다'
        min: 5
        done: false
      - slug: xunzi
        title: '순자: 본성은 가꾸어야 착해진다'
        min: 5
        done: false
  - num: 6
    title: 노자, 장자, 묵자
    blurb: 억지로 하지 않는 삶, 모두를 아끼는 삶을 말한 사람들이에요.
    sections:
    - num: '6.1'
      title: 도가
      pages:
      - slug: laozi-dao
        title: '노자: 이름 붙일 수 없는 길, 도(道)'
        min: 5
        done: false
      - slug: wuwei
        title: '억지로 하지 않기: 무위(無爲)'
        min: 5
        done: false
      - slug: zhuangzi-butterfly
        title: '장자: 나비 꿈과 자유로운 마음'
        min: 5
        done: false
    - num: '6.2'
      title: 묵가
      pages:
      - slug: mozi
        title: '묵자: 내 가족처럼 모두를 아껴라, 겸애'
        min: 5
        done: false
  - num: 7
    title: 인도의 지혜
    blurb: 나는 누구인가, 괴로움은 왜 생기는가를 깊이 물었어요.
    sections:
    - num: '7.1'
      title: 나를 찾아서
      pages:
      - slug: upanishad-atman
        title: '우파니샤드: 내 안의 나와 우주의 근원'
        min: 5
        done: false
      - slug: four-truths
        title: '붓다: 괴로움을 끝내는 네 가지 진리'
        min: 5
        done: false
      - slug: no-self
        title: '붓다: 변하지 않는 ''나''는 없다, 무아'
        min: 5
        done: false
      - slug: nagarjuna
        title: '나가르주나: 모든 것은 기대어 있다, 공(空)'
        min: 5
        done: false
- id: 3
  title: 'III 마음의 평화와 믿음: 헬레니즘과 중세'
  blurb: 흔들리지 않는 마음을 찾고, 믿음과 이성을 이으려 한 천 년의 이야기예요.
  chapters:
  - num: 8
    title: 마음의 평화를 찾아서
    blurb: 나라가 흔들리던 시대, 사람들은 개인의 행복을 물었어요.
    sections:
    - num: '8.1'
      title: 헬레니즘 철학
      pages:
      - slug: epicurus
        title: '에피쿠로스: 작은 기쁨으로 사는 법'
        min: 5
        done: false
      - slug: stoics
        title: '스토아: 내가 바꿀 수 있는 것에만 마음 쓰기'
        min: 5
        done: false
      - slug: skeptics
        title: '회의주의: 판단을 잠시 멈추기'
        min: 5
        done: false
      - slug: diogenes
        title: '디오게네스: 가진 것 없이 자유롭게'
        min: 5
        done: false
  - num: 9
    title: 믿음과 이성
    blurb: 신을 믿는 일과 생각하는 일은 함께 갈 수 있을까요?
    sections:
    - num: '9.1'
      title: 고대 끝 무렵
      pages:
      - slug: augustine-evil
        title: '아우구스티누스: 나쁜 일은 어디서 왔을까'
        min: 5
        done: false
      - slug: augustine-time
        title: '아우구스티누스: 시간이란 무엇일까'
        min: 5
        done: false
      - slug: boethius
        title: '보에티우스: 운명이 등을 돌릴 때'
        min: 5
        done: false
    - num: '9.2'
      title: 중세 유럽
      pages:
      - slug: anselm
        title: '안셀무스: 생각만으로 신을 증명할 수 있을까'
        min: 5
        done: false
      - slug: aquinas
        title: '아퀴나스: 신앙과 이성은 싸우지 않는다'
        min: 5
        done: false
      - slug: ockham
        title: '오컴의 면도날: 설명은 단순하게'
        min: 5
        done: false
  - num: 10
    title: 이슬람 세계의 철학
    blurb: 그리스 철학을 지키고 발전시켜 유럽에 다시 건넨 사람들이에요.
    sections:
    - num: '10.1'
      title: 바그다드에서 코르도바까지
      pages:
      - slug: translation-movement
        title: '바그다드의 번역 운동: 그리스 철학을 이어받다'
        min: 5
        done: false
      - slug: avicenna
        title: '이븐 시나: 허공에 뜬 사람도 자신을 알까'
        min: 5
        done: false
      - slug: al-ghazali
        title: '가잘리: 불은 정말 솜을 태우는가'
        min: 5
        done: false
      - slug: averroes
        title: '이븐 루시드: 철학과 종교는 같은 진리를 말한다'
        min: 5
        done: false
  - num: 11
    title: 불교, 동쪽으로
    blurb: 인도에서 시작한 불교가 한반도에서 새롭게 꽃피었어요.
    sections:
    - num: '11.1'
      title: 한국 불교
      pages:
      - slug: wonhyo
        title: '원효: 다투는 생각들을 하나로, 화쟁'
        min: 5
        done: false
      - slug: jinul
        title: '지눌: 단번에 깨닫고 꾸준히 닦기'
        min: 5
        done: false
- id: 4
  title: 'IV 의심과 이성: 근대의 문'
  blurb: 확실한 것은 무엇인지, 나라는 왜 있는지를 처음부터 다시 물었어요.
  chapters:
  - num: 12
    title: 새로운 시대
    blurb: 교회와 옛 책 대신 사람과 경험을 보기 시작했어요.
    sections:
    - num: '12.1'
      title: 르네상스와 그 뒤
      pages:
      - slug: machiavelli
        title: '마키아벨리: 정치는 있는 그대로 보자'
        min: 5
        done: false
      - slug: montaigne
        title: '몽테뉴: 나는 무엇을 아는가'
        min: 5
        done: false
      - slug: bacon
        title: '베이컨: 머릿속 네 가지 우상'
        min: 5
        done: false
  - num: 13
    title: 이성으로 확실한 것 찾기
    blurb: 생각만으로 흔들리지 않는 토대를 찾으려 했어요.
    sections:
    - num: '13.1'
      title: 데카르트
      pages:
      - slug: methodic-doubt
        title: '데카르트: 모든 것을 한 번 의심해 보기'
        min: 5
        done: false
      - slug: cogito
        title: 나는 생각한다, 그러므로 나는 있다
        min: 5
        done: false
      - slug: mind-body
        title: 마음과 몸은 다른 것일까
        min: 5
        done: false
    - num: '13.2'
      title: 데카르트 다음
      pages:
      - slug: spinoza
        title: '스피노자: 신은 곧 자연이다'
        min: 5
        done: false
      - slug: leibniz
        title: '라이프니츠: 왜 아무것도 없지 않고 무언가 있을까'
        min: 5
        done: false
      - slug: pascal
        title: '파스칼: 생각하는 갈대와 신에 대한 내기'
        min: 5
        done: false
  - num: 14
    title: 경험에서 시작하기
    blurb: 모든 앎은 보고 듣고 만지는 데서 온다고 봤어요.
    sections:
    - num: '14.1'
      title: 경험론
      pages:
      - slug: locke-blank-slate
        title: '로크: 우리는 빈 종이로 태어난다'
        min: 5
        done: false
      - slug: berkeley
        title: '버클리: 아무도 안 보면 나무는 있을까'
        min: 5
        done: false
      - slug: hume-cause
        title: '흄: 원인과 결과는 눈에 보이지 않는다'
        min: 5
        done: false
      - slug: hume-is-ought
