site_name: 철학 정주행
site_description: 열 살도 이해하는 철학사. 누가, 언제, 무엇을 물었고 어떻게 답했는지를 동서양을 함께 따라가는 한국어 웹 교과서
site_url: https://philosophy-jungjuhang.github.io/philosophy_jungjuhang/
copyright: 철학 정주행 · 원전 문장은 옮기지 않고 다시 썼어요. 페이지마다 출처와 기준 날짜가 있어요.
theme:
  name: material
  logo: assets/owl-logo.svg
  favicon: assets/owl-logo.svg
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 다크 모드}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 라이트 모드}
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css
extra_javascript:
  - javascripts/owl.js
  - javascripts/reveal.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - attr_list
  - pymdownx.mark: {smart_mark: false}
  - md_in_html
  - footnotes
  - toc: {permalink: true}
