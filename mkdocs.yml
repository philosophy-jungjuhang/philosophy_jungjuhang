site_name: 철학 정주행
site_description: 열 살도 이해하는 철학사. 누가, 언제, 무엇을 물었고 어떻게 답했는지를 동서양을 함께 따라가는 한국어 웹 교과서
site_url: https://philosophy-jungjuhang.github.io/philosophy_jungjuhang/
copyright: 철학 정주행 · 원전 문장은 옮기지 않고 다시 썼어요. 페이지마다 출처와 기준 날짜가 있어요.
theme:
  name: material
  logo: assets/owl-logo.svg
  favicon: assets/owl-logo.svg
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 다크 모드}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 라이트 모드}
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css
extra_javascript:
  - javascripts/owl.js
  - javascripts/reveal.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - attr_list
  - pymdownx.mark: {smart_mark: false}
  - md_in_html
  - footnotes
  - toc: {permalink: true}
nav:
  - 홈: index.md
  - "I 철학의 시작":
    - part1/index.md
    - "1장 철학은 무엇을 묻는가":
      - part1/ch01/index.md
    - "2장 소크라테스":
      - part1/ch02/index.md
    - "3장 플라톤":
      - part1/ch03/index.md
      - "3.1 두 개의 세계":
        - "플라톤은 보이는 것 너머에 진짜가 있다고 봤다: 이데아": part1/ch03/forms.md
    - "4장 아리스토텔레스":
      - part1/ch04/index.md
  - "II 같은 시대, 동쪽에서":
    - part2/index.md
    - "5장 공자와 유가":
      - part2/ch05/index.md
    - "6장 노자, 장자, 묵자":
      - part2/ch06/index.md
    - "7장 인도의 지혜":
      - part2/ch07/index.md
  - "III 마음의 평화와 믿음":
    - part3/index.md
    - "8장 마음의 평화를 찾아서":
      - part3/ch08/index.md
    - "9장 믿음과 이성":
      - part3/ch09/index.md
    - "10장 이슬람 세계의 철학":
      - part3/ch10/index.md
    - "11장 불교, 동쪽으로":
      - part3/ch11/index.md
  - "IV 의심과 이성":
    - part4/index.md
    - "12장 새로운 시대":
      - part4/ch12/index.md
    - "13장 이성으로 확실한 것 찾기":
      - part4/ch13/index.md
    - "14장 경험에서 시작하기":
      - part4/ch14/index.md
    - "15장 나라는 왜 있을까":
      - part4/ch15/index.md
    - "16장 동아시아의 새 유학":
      - part4/ch16/index.md
  - "V 19세기":
    - part5/index.md
    - "17장 칸트와 그 뒤":
      - part5/ch17/index.md
    - "18장 가장 많은 사람의 행복":
      - part5/ch18/index.md
    - "19장 실존을 향해":
      - part5/ch19/index.md
  - "VI 20세기":
    - part6/index.md
    - "20장 언어와 과학":
      - part6/ch20/index.md
    - "21장 실존과 자유":
