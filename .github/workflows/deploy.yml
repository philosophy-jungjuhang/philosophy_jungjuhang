name: Deploy
on:
  push:
    branches: [main, claude/new-session-26z95m]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - run: ghp-import --no-jekyll --push --force --message "Deploy site" site
